<script id="browser-logger-active">
(function() {
    const ENDPOINT = 'http://127.0.0.1:8000/_boost/browser-logs';
    const logQueue = [];
    let flushTimeout = null;

    console.log('🔍 Browser logger active (MCP server detected). Posting to: ' + ENDPOINT);

    // Store original console methods
    const originalConsole = {
        log: console.log,
        info: console.info,
        error: console.error,
        warn: console.warn,
        table: console.table
    };

    // Helper to safely stringify values
    function safeStringify(obj) {
        const seen = new WeakSet();
        return JSON.stringify(obj, (key, value) => {
            if (typeof value === 'object' && value !== null) {
                if (seen.has(value)) return '[Circular]';
                seen.add(value);
            }
            if (value instanceof Error) {
                return {
                    name: value.name,
                    message: value.message,
                    stack: value.stack
                };
            }
            return value;
        });
    }

    // Batch and send logs
    function flushLogs() {
        if (logQueue.length === 0) return;

        const batch = logQueue.splice(0, logQueue.length);

        fetch(ENDPOINT, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-Requested-With': 'XMLHttpRequest'
            },
            body: JSON.stringify({ logs: batch })
        }).catch(err => {
            // Silently fail to avoid infinite loops
            originalConsole.error('Failed to send logs:', err);
        });
    }

    // Debounced flush (100ms)
    function scheduleFlush() {
        if (flushTimeout) clearTimeout(flushTimeout);
        flushTimeout = setTimeout(flushLogs, 100);
    }

    // Intercept console methods
    ['log', 'info', 'error', 'warn', 'table'].forEach(method => {
        console[method] = function(...args) {
            // Call original method
            originalConsole[method].apply(console, args);

            // Capture log data
            try {
                logQueue.push({
                    type: method,
                    timestamp: new Date().toISOString(),
                    data: args.map(arg => {
                        try {
                            return typeof arg === 'object' ? JSON.parse(safeStringify(arg)) : arg;
                        } catch (e) {
                            return String(arg);
                        }
                    }),
                    url: window.location.href,
                    userAgent: navigator.userAgent
                });

                scheduleFlush();
            } catch (e) {
                // Fail silently
            }
        };
    });

    // Global error handlers for uncaught errors
    const originalOnError = window.onerror;
    window.onerror = function boostErrorHandler(errorMsg, url, lineNumber, colNumber, error) {
        try {
            logQueue.push({
                type: 'uncaught_error',
                timestamp: new Date().toISOString(),
                data: [{
                    message: errorMsg,
                    filename: url,
                    lineno: lineNumber,
                    colno: colNumber,
                    error: error ? {
                        name: error.name,
                        message: error.message,
                        stack: error.stack
                    } : null
                }],
                url: window.location.href,
                userAgent: navigator.userAgent
            });

            scheduleFlush();
        } catch (e) {
            // Fail silently
        }

        // Call original handler if it exists
        if (originalOnError && typeof originalOnError === 'function') {
            return originalOnError(errorMsg, url, lineNumber, colNumber, error);
        }

        // Let the error continue to propagate
        return false;
    }
    window.addEventListener('error', (event) => {
        try {
            logQueue.push({
                type: 'window_error',
                timestamp: new Date().toISOString(),
                data: [{
                    message: event.message,
                    filename: event.filename,
                    lineno: event.lineno,
                    colno: event.colno,
                    error: event.error ? {
                        name: event.error.name,
                        message: event.error.message,
                        stack: event.error.stack
                    } : null
                }],
                url: window.location.href,
                userAgent: navigator.userAgent
            });

            scheduleFlush();
        } catch (e) {
            // Fail silently
        }

        // Let the error continue to propagate
        return false;
    });
    window.addEventListener('unhandledrejection', (event) => {
        try {
            logQueue.push({
                type: 'error',
                timestamp: new Date().toISOString(),
                data: [{
                    message: 'Unhandled Promise Rejection',
                    reason: event.reason instanceof Error ? {
                        name: event.reason.name,
                        message: event.reason.message,
                        stack: event.reason.stack
                    } : event.reason
                }],
                url: window.location.href,
                userAgent: navigator.userAgent
            });

            scheduleFlush();
        } catch (e) {
            // Fail silently
        }

        // Let the rejection continue to propagate
        return false;
    });

    // Flush on page unload
    window.addEventListener('beforeunload', () => {
        if (logQueue.length > 0) {
            navigator.sendBeacon(ENDPOINT, JSON.stringify({ logs: logQueue }));
        }
    });
})();
</script>
</head>
<body class="bg-gray-50">
    <div class="flex h-screen bg-gray-100">
        <div class="w-64 bg-white shadow-lg">
            <div class="flex items-center justify-center h-16 bg-blue-600 text-white font-bold text-xl">
                Laundry POS
            </div>

            <nav class="mt-6 space-y-2 px-4">
                <a href="http://127.0.0.1:8000/dashboard" class="flex items-center px-4 py-3 rounded-lg transition text-gray-700 hover:bg-blue-50 hover:text-blue-600">
                    <span>Dashboard</span>
                </a>
                <a href="http://127.0.0.1:8000/transactions" class="flex items-center px-4 py-3 rounded-lg transition text-gray-700 hover:bg-blue-50 hover:text-blue-600">
                    <span>Transaksi</span>
                </a>
                <a href="http://127.0.0.1:8000/customers" class="flex items-center px-4 py-3 rounded-lg transition bg-blue-50 text-blue-700">
                    <span>Pelanggan</span>
                </a>
                <a href="http://127.0.0.1:8000/services" class="flex items-center px-4 py-3 rounded-lg transition text-gray-700 hover:bg-blue-50 hover:text-blue-600">
                    <span>Layanan</span>
                </a>
                <a href="http://127.0.0.1:8000/reports" class="flex items-center px-4 py-3 rounded-lg transition text-gray-700 hover:bg-blue-50 hover:text-blue-600">
                    <span>Laporan</span>
                </a>

                <hr class="my-4">

                <button id="logoutBtn" class="w-full flex items-center px-4 py-3 text-gray-700 rounded-lg hover:bg-red-50 hover:text-red-600 transition">
                    <span>Logout</span>
                </button>
            </nav>
        </div>

        <div class="flex-1 flex flex-col overflow-hidden">
            <div class="bg-white border-b border-gray-200 px-8 py-4 flex justify-between items-center">
                <h1 class="text-2xl font-bold text-gray-800">Manajemen Pelanggan</h1>
                <div class="flex items-center space-x-4">
                    <span id="userName" class="text-gray-700">Admin</span>
                </div>
            </div>

            <div class="flex-1 overflow-y-auto p-8">
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
    <div class="bg-white rounded-xl shadow p-6">
        <h2 class="text-lg font-semibold text-gray-800 mb-4" id="formTitle">Tambah Pelanggan</h2>
        <form id="customerForm" class="space-y-4">
            <input type="hidden" id="customerId">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Nama</label>
                <input id="customerName" type="text" class="w-full border border-gray-300 rounded-lg px-3 py-2">
                <p data-error-for="name" class="hidden text-sm text-red-600 mt-1"></p>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                <input id="customerEmail" type="email" class="w-full border border-gray-300 rounded-lg px-3 py-2">
                <p data-error-for="email" class="hidden text-sm text-red-600 mt-1"></p>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input id="customerPassword" type="password" class="w-full border border-gray-300 rounded-lg px-3 py-2" placeholder="Wajib saat tambah, opsional saat edit">
                <p data-error-for="password" class="hidden text-sm text-red-600 mt-1"></p>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">No HP</label>
                <input id="customerPhone" type="text" class="w-full border border-gray-300 rounded-lg px-3 py-2">
                <p data-error-for="phone" class="hidden text-sm text-red-600 mt-1"></p>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Alamat</label>
                <textarea id="customerAddress" class="w-full border border-gray-300 rounded-lg px-3 py-2"></textarea>
                <p data-error-for="address" class="hidden text-sm text-red-600 mt-1"></p>
            </div>
            <div class="flex gap-2">
                <button class="bg-blue-600 text-white px-4 py-2 rounded-lg" type="submit">Simpan</button>
                <button class="bg-gray-200 text-gray-700 px-4 py-2 rounded-lg" type="button" onclick="resetCustomerForm()">Reset</button>
            </div>
        </form>
    </div>

    <div class="lg:col-span-2 bg-white rounded-xl shadow overflow-hidden">
        <div class="px-6 py-4 border-b border-gray-200 flex items-center justify-between gap-4">
            <h3 class="text-lg font-semibold text-gray-800">Daftar Pelanggan</h3>
            <input id="customerSearch" type="text" placeholder="Cari nama/no hp..." autocomplete="off" class="border border-gray-300 rounded-lg px-3 py-2 w-64">
        </div>
        <div class="overflow-x-auto">
            <table class="min-w-full text-sm">
                <thead class="bg-gray-50 text-gray-600">
                    <tr>
                        <th class="px-6 py-3 text-left">Nama</th>
                        <th class="px-6 py-3 text-left">Email</th>
                        <th class="px-6 py-3 text-left">No HP</th>
                        <th class="px-6 py-3 text-left">Aksi</th>
                    </tr>
                </thead>
                <tbody id="customerTableBody" class="divide-y divide-gray-100"></tbody>
            </table>
        </div>
        <div class="px-6 py-4 border-t border-gray-100 flex items-center justify-between">
            <div id="customerMeta" class="text-sm text-gray-500"></div>
            <div id="customerPagination" class="flex items-center gap-2"></div>
        </div>
    </div>
</div>

<script>
    let customerPage = 1;
    let customerLastPage = 1;

    function resetCustomerForm() {
        document.getElementById('customerId').value = '';
        document.getElementById('customerName').value = '';
        document.getElementById('customerEmail').value = '';
        document.getElementById('customerPassword').value = '';
        document.getElementById('customerPhone').value = '';
        document.getElementById('customerAddress').value = '';
        document.getElementById('formTitle').textContent = 'Tambah Pelanggan';
        window.clearInlineErrors('customerForm');
    }

    function resetCustomerSearch() {
        document.getElementById('customerSearch').value = '';
    }

    function renderCustomerPagination() {
        const wrapper = document.getElementById('customerPagination');
        wrapper.innerHTML = '';

        if (customerLastPage <= 1) return;

        const prevBtn = document.createElement('button');
        prevBtn.textContent = 'Sebelumnya';
        prevBtn.className = 'px-3 py-1 border rounded-lg text-sm';
        prevBtn.disabled = customerPage <= 1;
        prevBtn.onclick = () => loadCustomers(customerPage - 1);
        wrapper.appendChild(prevBtn);

        const info = document.createElement('span');
        info.className = 'text-sm text-gray-600';
        info.textContent = `Halaman ${customerPage} / ${customerLastPage}`;
        wrapper.appendChild(info);

        const nextBtn = document.createElement('button');
        nextBtn.textContent = 'Berikutnya';
        nextBtn.className = 'px-3 py-1 border rounded-lg text-sm';
        nextBtn.disabled = customerPage >= customerLastPage;
        nextBtn.onclick = () => loadCustomers(customerPage + 1);
        wrapper.appendChild(nextBtn);
    }

    async function loadCustomers(page = 1) {
        toggleLoading(true);
        try {
            const search = document.getElementById('customerSearch').value;
            const response = await window.apiFetch(`/api/customers?per_page=10&page=${page}&search=${encodeURIComponent(search)}`);
            const tbody = document.getElementById('customerTableBody');
            tbody.innerHTML = '';

            customerPage = response.current_page;
            customerLastPage = response.last_page;
            document.getElementById('customerMeta').textContent = `Total ${response.total} data`;
            renderCustomerPagination();

            if (!response.data.length) {
                tbody.innerHTML = `<tr><td colspan="4" class="px-6 py-6 text-center text-gray-500">${
                    search ? 'Data pelanggan tidak ditemukan untuk pencarian ini.' : 'Belum ada pelanggan.'
                }</td></tr>`;
                return;
            }

            response.data.forEach((customer) => {
                tbody.innerHTML += `
                    <tr>
                        <td class="px-6 py-4">${customer.user?.name ?? '-'}</td>
                        <td class="px-6 py-4">${customer.user?.email ?? '-'}</td>
                        <td class="px-6 py-4">${customer.phone}</td>
                        <td class="px-6 py-4 space-x-2">
                            <button class="text-blue-600" onclick="editCustomer(${customer.id})">Edit</button>
                            <button class="text-red-600" onclick="deleteCustomer(${customer.id})">Hapus</button>
                        </td>
                    </tr>
                `;
            });
        } catch (error) {
            showToast(error.message, 'error');
        } finally {
            toggleLoading(false);
        }
    }

    async function editCustomer(id) {
        try {
            const response = await window.apiFetch(`/api/customers/${id}`);
            const customer = response.data;
            document.getElementById('customerId').value = customer.id;
            document.getElementById('customerName').value = customer.user?.name ?? '';
            document.getElementById('customerEmail').value = customer.user?.email ?? '';
            document.getElementById('customerPassword').value = '';
            document.getElementById('customerPhone').value = customer.phone;
            document.getElementById('customerAddress').value = customer.address;
            document.getElementById('formTitle').textContent = 'Edit Pelanggan';
            window.clearInlineErrors('customerForm');
        } catch (error) {
            showToast(error.message, 'error');
        }
    }

    async function deleteCustomer(id) {
        if (!confirm('Yakin ingin menghapus pelanggan ini?')) return;
        toggleLoading(true);
        try {
            const response = await window.apiFetch(`/api/customers/${id}`, { method: 'DELETE' });
            showToast(response.message, 'success');
            await loadCustomers(customerPage);
        } catch (error) {
            showToast(error.message, 'error');
        } finally {
            toggleLoading(false);
        }
    }

    document.getElementById('customerForm').addEventListener('submit', async (event) => {
        event.preventDefault();
        toggleLoading(true);
        window.clearInlineErrors('customerForm');

        const id = document.getElementById('customerId').value;
        const payload = {
            name: document.getElementById('customerName').value,
            email: document.getElementById('customerEmail').value,
            phone: document.getElementById('customerPhone').value,
            address: document.getElementById('customerAddress').value
        };

        const password = document.getElementById('customerPassword').value;
        if (!id || password) payload.password = password;

        try {
            const response = await window.apiFetch(
                id ? `/api/customers/${id}` : '/api/customers',
                {
                    method: id ? 'PUT' : 'POST',
                    body: JSON.stringify(payload)
                }
            );

            showToast(response.message, 'success');
            resetCustomerForm();
            if (!id) {
                resetCustomerSearch();
                await loadCustomers(1);
            } else {
                await loadCustomers(customerPage);
            }
        } catch (error) {
            if (error.status === 422) {
                window.applyInlineErrors('customerForm', error.errors);
            }
            showToast(error.message, 'error');
        } finally {
            toggleLoading(false);
        }
    });

    document.getElementById('customerSearch').addEventListener('input', () => {
        loadCustomers(1);
    });

    loadCustomers();
</script>
            </div>
        </div>
    </div>

    <div id="loadingSpinner" class="hidden fixed inset-0 bg-gray-600 bg-opacity-50 items-center justify-center z-50">
        <div class="bg-white rounded-lg p-8 text-center">
            <div class="animate-spin inline-flex items-center justify-center w-12 h-12 border-4 border-blue-500 border-t-transparent rounded-full"></div>
            <p class="mt-4 text-gray-700">Memproses...</p>
        </div>
    </div>

    <div id="toast" class="hidden fixed top-4 right-4 px-6 py-3 bg-white rounded-lg shadow-lg border-l-4 z-50 text-gray-700"></div>

    <script>
        const token = localStorage.getItem('auth_token');

        if (!token) {
            window.location.href = '/login';
        }

        window.toggleLoading = function(show) {
            const spinner = document.getElementById('loadingSpinner');
            if (show) {
                spinner.classList.remove('hidden');
                spinner.classList.add('flex');
            } else {
                spinner.classList.add('hidden');
                spinner.classList.remove('flex');
            }
        };

        window.showToast = function(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'fixed top-4 right-4 px-6 py-3 bg-white rounded-lg shadow-lg border-l-4 z-50 text-gray-700';

            if (type === 'success') toast.classList.add('border-green-500');
            if (type === 'error') toast.classList.add('border-red-500');
            if (type === 'info') toast.classList.add('border-blue-500');

            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 3000);
        };

        window.formatCurrency = function(value) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR' }).format(value || 0);
        };

        window.apiFetch = async function(url, options = {}) {
            const headers = { ...(options.headers || {}), Authorization: `Bearer ${token}` };
            if (!(options.body instanceof FormData)) {
                headers['Content-Type'] = headers['Content-Type'] || 'application/json';
            }

            const response = await fetch(url, { ...options, headers });
            const data = await response.json().catch(() => ({}));

            if (response.status === 401) {
                localStorage.removeItem('auth_token');
                window.location.href = '/login';
                throw new Error('Sesi berakhir, silakan login ulang.');
            }

            if (!response.ok) {
                const message = data.message || 'Permintaan gagal.';
                const error = new Error(message);
                error.status = response.status;
                error.errors = data.errors || {};
                throw error;
            }

            return data;
        };

        window.clearInlineErrors = function(formId) {
            document.querySelectorAll(`#${formId} [data-error-for]`).forEach((item) => {
                item.textContent = '';
                item.classList.add('hidden');
            });
        };

        window.applyInlineErrors = function(formId, errors = {}) {
            Object.keys(errors).forEach((key) => {
                const errorElement = document.querySelector(`#${formId} [data-error-for="${key}"]`);
                if (errorElement) {
                    errorElement.textContent = errors[key][0];
                    errorElement.classList.remove('hidden');
                }
            });
        };

        async function loadProfile() {
            try {
                const profile = await window.apiFetch('/api/profile');
                document.getElementById('userName').textContent = profile.user.name;

                if (profile.user.role !== 'admin') {
                    showToast('Akun ini bukan admin.', 'error');
                    localStorage.removeItem('auth_token');
                    window.location.href = '/login';
                }
            } catch (error) {
                showToast(error.message, 'error');
            }
        }

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            toggleLoading(true);
            try {
                await window.apiFetch('/api/logout', { method: 'POST' });
            } catch (_) {
                // Ignore logout API errors and clear local state anyway.
            } finally {
                localStorage.removeItem('auth_token');
                toggleLoading(false);
                window.location.href = '/login';
            }
        });

        loadProfile();
    </script>
</body>
</html>
